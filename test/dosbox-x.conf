# S3Wide development baseline
# Adjust paths and host-specific SDL/output settings locally.

[sdl]
fullscreen=false
windowresolution=1280x720

[dosbox]
machine=svga_s3trio64
memsize=32

[video]
vmemsize=4
allow high definition vesa modes=true
allow unusual vesa modes=true
allow low resolution vesa modes=false

[cpu]
core=normal
cputype=pentium
cycles=max

[render]
aspect=false
scaler=none

# Add a local [autoexec] section in an untracked override if desired.
# Do not make host scaling masquerade as successful guest 1280x720.
